<app-hero [mensaje]="hero.mensaje" [titulo]="hero.titulo"></app-hero>
<div class="home">
  <div class="container">

    <div class="tab-container">
      <div class="message">
        <span class="mensajeInicio">{{ paginaData?.resumen }}</span>
      </div>
      <div class="razones">
        <div class="menu-razones">
          <ul>
            <li class="item-menu"><a routerLink="tarifa" routerLinkActive="active">Tarifa</a></li>
            <li class="item-menu"><a routerLink="Ubicacion" routerLinkActive="active">Ubicación</a></li>
            <li class="item-menu"><a routerLink="instalaciones" routerLinkActive="active">Instalaciones</a></li>
          </ul>
        </div>
        <div class="contenido-razones">
          <router-outlet></router-outlet>
        </div>
      </div>
      <div class="comentarios">
        <div class="carucel-comentarios">

        </div>
      </div>
    </div>

    <div class="comentarios">
      <div class="titulo">
        <h2>Comentarios de nuestros clientes</h2>
        <button class="add-comment-btn" (click)="openCommentDialog()">
          <i class="fa-solid fa-comment"></i> Dejar un comentario
        </button>
      </div>
      <div class="carousel-container">
        <button class="nav-btn prev" (click)="prevComment()">❮</button>
        
        <div class="carousel" [style.transform]="'translateX(' + (-currentIndex * 100) + '%)'">
          <div class="comment-card" *ngFor="let comentario of comentarios">
            <h3>{{ comentario.autor }} - {{ comentario.pais }}</h3>
            <p>{{ comentario.comentario }}</p>
            <small>{{ comentario.fecha | date: 'yyyy-MM-dd' }}</small>
            <ul>
              <li *ngFor="let star of [].constructor(comentario.estrellas)">
                ⭐
              </li>
            </ul>
          </div>
        </div>
    
        <button class="nav-btn next" (click)="nextComment()">❯</button>
      </div>
    </div>    
    
  </div>
</div>


<p-dialog 
  [(visible)]="commentDialogVisible" 
  [modal]="true" 
  [draggable]="false"
  [resizable]="false"
  styleClass="comment-dialog"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  header="Comparte tu experiencia">
  
  <form [formGroup]="commentForm" (ngSubmit)="onSubmitComment()">
    <div class="form-group">
      <label for="autor">Nombre</label>
      <input id="autor" type="text" pInputText formControlName="autor">
    </div>

    <div class="form-group">
      <label for="pais">País</label>
      <input id="pais" type="text" pInputText formControlName="pais">
    </div>

    <div class="form-group">
      <label for="comentario">Comentario</label>
      <textarea id="comentario" rows="5" pInputTextarea formControlName="comentario"></textarea>
    </div>

    <div class="form-group">
      <label>Calificación</label>
      <p-rating formControlName="estrellas" [stars]="5" [cancel]="false"></p-rating>
    </div>

    <div class="dialog-footer">
      <p-button 
        label="Cancelar" 
        styleClass="p-button-text" 
        (click)="commentDialogVisible = false">
      </p-button>
      <p-button 
        label="Enviar comentario" 
        type="submit" 
        [disabled]="!commentForm.valid">
      </p-button>
    </div>
  </form>
</p-dialog>
