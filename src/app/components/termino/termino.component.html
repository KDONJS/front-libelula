<div class="hero-contac">
  <span>Términos y Condiciones</span>
</div>

<div class="terminos-container">
  <!-- Static section -->
  <section>
    <h2>1. Introducción</h2>
    <p>Bienvenido a <strong>Libélula Hotel</strong>. Al acceder y utilizar nuestros servicios, usted acepta los siguientes términos y condiciones.</p>
  </section>

  <!-- Dynamic sections -->
  <section *ngFor="let termino of terminos; let i = index">
    <h2>{{i + 2}}. {{termino.titulo}}</h2>
    <div [innerHTML]="termino.detalle"></div>
  </section>
</div>
